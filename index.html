<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Organizer</title>
<meta name="description" content="Write it down, do one thing, and get advice when you are stuck.">
<meta name="theme-color" content="#0c0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organizer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/core.css?v=202609081535">
<link rel="stylesheet" href="assets/css/app.css?v=202609081535">
</head>
<body>

<div id="veil"><div class="vcore"></div><p>Life Organizer</p></div>
<canvas id="field"></canvas>

<div id="app">
  <header id="top">
    <span class="mark"></span>
    <span id="status"></span>
    <button id="gear" aria-label="Settings">⚙</button>
  </header>

  <main id="panes">
    <section class="pane on" data-pane="do"><div class="col"></div></section>
    <section class="pane" data-pane="write"><div class="col"></div></section>
    <section class="pane" data-pane="advice"><div class="col"></div></section>
    <section class="pane" data-pane="me"><div class="col"></div></section>
  </main>
</div>

<!-- outside #app on purpose: a fixed bar inside a backdrop-filtered
     header would pin to the header instead of the screen -->
<nav id="tabs"></nav>

<div id="sheet2" hidden><div class="box"></div></div>
<div id="toast"></div>

<script src="assets/js/store.js?v=202609081535"></script>
<script src="assets/js/library.js?v=202609081535"></script>
<script src="assets/js/ui.js?v=202609081535"></script>
<script src="assets/js/quotes.js?v=202609081535"></script>
<script src="assets/js/actions.js?v=202609081535"></script>
<script src="assets/js/classify.js?v=202609081535"></script>
<script src="assets/js/insight.js?v=202609081535"></script>
<script src="assets/js/sync.js?v=202609081535"></script>
<script src="assets/js/advice.js?v=202609081535"></script>
<script src="assets/js/shell.js?v=202609081535"></script>

<!-- registration order is the order in the bar -->
<script src="assets/js/surfaces/do.js?v=202609081535"></script>
<script src="assets/js/surfaces/write.js?v=202609081535"></script>
<script src="assets/js/surfaces/advice.js?v=202609081535"></script>
<script src="assets/js/surfaces/me.js?v=202609081535"></script>

<script>
  LO.machine.boot();
  // offline support; registers only over https or localhost, which is fine
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
